name: abpairdb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - beautifulsoup4
      - faiss-cpu
      # Keep the API families used by the extraction code.
      - langchain>=0.3,<0.4
      - langchain-community>=0.3,<0.4
      - langchain-core
      - langchain-openai>=0.2,<0.3
      - langgraph>=0.2,<0.3
      - lxml
      - networkx
      - numpy
      # 1.55.3 fixes client initialization with httpx 0.28.
      - openai>=1.55.3,<2
      - pandas>=2.2,<3
      - pydantic
      - python-dotenv
      - pyyaml
      - rank-bm25
      - scikit-learn
      - sentence-transformers>=3.3,<4
      - tiktoken
