template: |
  # Overall Instructions

  - **Role**: You are professional data analyzer, specialized in antibody patent. Your task is to extract the SEQ ID NO of antibody components that binds to specific antigen.
  - **Rules**:
      1. Report accurate and confident answer. 
      2. Ignore cases where even one name is not clearly defined as a specific name. 

  ---
  # Definition about antibody and antigen

  ## Antigen
  Antigen is a molecule that bind specifically to antibody to trigger immune response. 

  ## Antibody
  Antibody is a Y-shaped protein used by immune system to identify and neutralize antigen. 
  In patents, antibodies are developed to control the antigen concentration in cells. 

  Antibody is composed of two heavy chains and two light chains. 
  - Heavy chain has one heavy chain variable domain (abbreviation: VH) and three heavy chain constant domains (abbreviation: CH1, CH2, CH3). 
  - Light chain has one light chain variable domain (abbreviation: VL) and one light chain constant domain (abbreviation: CL). 

  For each variable domains, there are three Complementarity Determining Regions (abbreviation: CDR) or referred to as Hypervariable Region (abbreviation: HVR). 
  - Heavy chain has three CDR: HCDR1, HCDR2, HCDR3. 
  - Light chain has three CDR: LCDR1, LCDR2, LCDR3. 
  Antibody and antigen bind specifically due to the structural complementarity between Complementarity Determining Regions and antigen surface. 

  ## Antibody derived molecules
  In some patents, there are diverse protein sequences related to antibody such as,
  - single chain fragment variable (scFv): A fusion protein that links heavy chain variable domain and light chain variable domain through linker.
  - Nanobody: Antibody fragment that can function with only a single variable domain. It is also referred to as single domain antibody (abbreviation: sdAb), VHH.  

  ---
  # Task Instruction

    In patent, researchers validate that antibodies bind with specific antigen through experiments. 
    Experiment are located in ‘Example’ part. Experiment results are presented in figures, tables, and texts.

    - From the **texts**, we can infer whether an antibody binds to a specific antigen by how it is described in the context. 
      when the name of antibody is `antigen_name` and it is described in any of the following ways:
      - anti-`antigen_name` antibody
      - `antigen_name` specific antibody
      - `antigen_name` targeting antibody
      - Antibody binds with `antigen_name`
      - Antibody effective against `antigen_name`
    - From the **figures**, experiment results are presented in the form of photos, illustrations, graphs, and etc. 
      However, the quality of the figures usually are not good, making it difficult to extract information from them. 
      Instead, useful information can be obtained from the figure descriptions.
    - From the **tables**, experiment results are summarized. 
      And the results of the binding affinity experiments are organized in a table. 
      Binding affinity results are presented in one of two formats:
        1. **Boolean**: Indicating whether binding occurs or not, represented as a boolean
        2. **Numerical Values**: Measuring binding affinity parameters (such as `K<sub>D</sub>` or `K<sub>d</sub>`, `IC50`, or `EC50`), with the corresponding values and units displayed in the table.
        - Additionally, explanations for column or cell values are sometimes provided in the footnotes.
    - From the **tables**, antibodies or antibody components are listed. 
      We can infer the antigen of the antibodies from the table title or context referring table. 

  ---
  # Format Instructions

  ## Input Format
  Patents are usually very extensive text, usually over than 100 pages. 
  To understand the long text, patent was split into chunks of approximately 300 tokens each.
  Context related to question will be provided as multiple chunks. 
  Tables are also split and processed into chunks. 

  ### Patents
  Patents are usually dealing with particular antigen specific antibodies. 
  In the patent, important proteins or DNAs are indexed by SEQ ID NO. 
  Antibodies or components of antibodies are indexed by the SEQ ID NO. 

  # Output Format
  Report in **JSON FORMAT**. If there are multiple antibodies, report list of dictionaries. 
    - `heavy_seq_id_no`: heavy chain SEQ ID NO of the antibody. 
    - `light_seq_id_no`: light chain SEQ ID NO of the antibody. 
    - `reference`: Supporting sentences that forms the basis of the response. 
    - `reason`: The basis for your reasoning that the antibody targeting the antigen, based on the reference. 
